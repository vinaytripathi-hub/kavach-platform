name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PYTHON_VERSION: "3.12"

jobs:
  # =========================================================================
  # Lint and type-check (fast; runs first to fail-fast on style/type issues)
  # =========================================================================
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          # No uv.lock in this repo; cache on the manifest instead.
          cache-dependency-glob: pyproject.toml

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install dev dependencies
        run: |
          uv venv --python 3.12 .venv
          source .venv/bin/activate
          uv pip install -e ".[dev,mcp]"

      - name: Ruff (lint)
        run: |
          source .venv/bin/activate
          ruff check .

      - name: Ruff (format check)
        run: |
          source .venv/bin/activate
          ruff format --check .

      - name: Mypy (strict type check)
        run: |
          source .venv/bin/activate
          mypy kavach tests

  # =========================================================================
  # Unit tests with coverage (the gate for substrate coverage floor)
  # =========================================================================
  unit-tests:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          # No uv.lock in this repo; cache on the manifest instead.
          cache-dependency-glob: pyproject.toml

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install dev dependencies
        run: |
          uv venv --python 3.12 .venv
          source .venv/bin/activate
          uv pip install -e ".[dev,mcp]"

      - name: Run unit tests with coverage
        run: |
          source .venv/bin/activate
          pytest -m unit \
            --cov=kavach \
            --cov-report=xml \
            --cov-report=term-missing:skip-covered \
            --cov-fail-under=80

      - name: Upload coverage XML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  # =========================================================================
  # Integration tests (against a real Postgres 16 — production-target version
  # per ADR-0004)
  # =========================================================================
  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kavach
          POSTGRES_PASSWORD: kavach
          POSTGRES_DB: kavach_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          # No uv.lock in this repo; cache on the manifest instead.
          cache-dependency-glob: pyproject.toml

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install dev dependencies
        run: |
          uv venv --python 3.12 .venv
          source .venv/bin/activate
          uv pip install -e ".[dev,mcp]"

      - name: Run integration tests
        env:
          KAVACH_DATABASE_URL: postgresql+asyncpg://kavach:kavach@localhost:5432/kavach_test
        run: |
          source .venv/bin/activate
          # Use --co to handle the "no integration tests collected yet" case
          # during the scaffolding phase. Will tighten to a hard fail in W01-S03.
          pytest -m integration --tb=short -v || \
            (pytest -m integration --collect-only -q 2>&1 | grep -q "no tests" && \
             echo "No integration tests yet — scaffold phase, allowing pass." && exit 0)

  # =========================================================================
  # Security audit — pip-audit checks for known vulnerabilities in deps
  # =========================================================================
  security:
    name: Security audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          # No uv.lock in this repo; cache on the manifest instead.
          cache-dependency-glob: pyproject.toml

      - name: Install pip-audit
        run: |
          uv tool install pip-audit

      - name: Run pip-audit
        run: |
          # Soft-fail during scaffold phase to allow review and triage.
          # Tightens to hard-fail in W01-S03 when real dependencies are exercised.
          pip-audit --strict || true

  # =========================================================================
  # Build wheel (sanity check: the package is buildable from source)
  # =========================================================================
  build:
    name: Build wheel
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint, unit-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          # No uv.lock in this repo; cache on the manifest instead.
          cache-dependency-glob: pyproject.toml

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Build wheel
        run: |
          uv venv --python 3.12 .venv
          source .venv/bin/activate
          uv pip install build
          python -m build

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: kavach-wheel
          path: dist/*.whl
          retention-days: 7
